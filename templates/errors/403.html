{% extends 'base.html' %}
{% block title %}Access Denied - 403{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center text-center">
    <div class="space-y-4 max-w-md bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
        <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-3xl mx-auto font-bold">
            <i class="fa-solid fa-user-lock"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900">403 - Access Denied</h1>
        <p class="text-slate-600 text-sm">You do not have administrative or required permissions to access this page.</p>
        <a href="{{ url_for('auth.index') }}" class="inline-block px-5 py-2.5 bg-blue-600 text-white font-bold rounded-xl text-sm shadow">Return Home</a>
    </div>
</div>
{% endblock %}
