{% extends 'base.html' %}
{% block title %}Page Not Found - 404{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center text-center">
    <div class="space-y-4 max-w-md bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
        <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-3xl mx-auto font-bold">
            <i class="fa-solid fa-compass"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900">404 - Page Not Found</h1>
        <p class="text-slate-600 text-sm">The requested URL or resource could not be found on AlumniConnect.</p>
        <a href="{{ url_for('auth.index') }}" class="inline-block px-5 py-2.5 bg-blue-600 text-white font-bold rounded-xl text-sm shadow">Return Home</a>
    </div>
</div>
{% endblock %}
