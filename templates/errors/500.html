{% extends 'base.html' %}
{% block title %}Internal Error - 500{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center text-center">
    <div class="space-y-4 max-w-md bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center text-3xl mx-auto font-bold">
            <i class="fa-solid fa-bug"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900">500 - Internal Server Error</h1>
        <p class="text-slate-600 text-sm">An unexpected system error occurred. Our technical logs have recorded this incident.</p>
        <a href="{{ url_for('auth.index') }}" class="inline-block px-5 py-2.5 bg-blue-600 text-white font-bold rounded-xl text-sm shadow">Return Home</a>
    </div>
</div>
{% endblock %}
