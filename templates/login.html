{% extends 'base.html' %}

{% block title %}Sign In - {{ app_name }}{% endblock %}

{% block public_content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-[#F7F9FC]">
  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/80 p-8 sm:p-10 shadow-xl space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-extrabold text-xl shadow-lg shadow-blue-500/30 mx-auto">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Sign In to AlumniConnect</h2>
      <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Select your portal role to continue</p>
    </div>

    <!-- Role Selection Tabs -->
    <div class="bg-slate-100 p-1 rounded-2xl flex space-x-1">
      <button type="button" data-role="student" onclick="selectRole('student')" class="role-tab-btn flex-1 py-2 text-xs font-bold rounded-xl text-center cursor-pointer bg-white shadow-xs text-blue-600">Student</button>
      <button type="button" data-role="alumni" onclick="selectRole('alumni')" class="role-tab-btn flex-1 py-2 text-xs font-bold rounded-xl text-center cursor-pointer text-slate-500">Alumni</button>
      <button type="button" data-role="admin" onclick="selectRole('admin')" class="role-tab-btn flex-1 py-2 text-xs font-bold rounded-xl text-center cursor-pointer text-slate-500">Administrator</button>
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
      <input type="hidden" name="role" id="role" value="student">

      <div>
        <label for="email" class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
          <input id="email" name="email" type="email" required class="w-full pl-9 pr-4 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-all" placeholder="name@college.edu">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
          <input id="password" name="password" type="password" required class="w-full pl-9 pr-9 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-all" placeholder="••••••••">
          <i id="login-pass-icon" onclick="togglePassword('password', 'login-pass-icon')" class="fa-solid fa-eye absolute right-3.5 top-3.5 text-slate-400 cursor-pointer text-xs"></i>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs font-semibold">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input id="remember" name="remember" type="checkbox" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
          <span class="text-slate-600">Remember Me</span>
        </label>
        <a href="#" onclick="alert('Password reset instructions have been sent to your email.'); return false;" class="text-blue-600 hover:text-blue-700">Forgot Password?</a>
      </div>

      <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-blue-600/25 transition-all">
        Sign In
      </button>
    </form>

    <div class="text-center pt-3 border-t border-slate-100 text-xs text-slate-500 font-semibold space-y-2">
      <a href="{{ url_for('auth.register') }}" class="text-blue-600 hover:text-blue-700 block">Need an account? Register Now</a>
      <a href="{{ url_for('auth.index') }}" class="hover:text-slate-900 transition-colors block">← Return to Landing Page</a>
    </div>
  </div>
</div>
{% endblock %}
